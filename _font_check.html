<!DOCTYPE html><html><head>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/brick-sans">
</head><body>
<div id="r">pending</div>
<div style="font-family:'Brick Sans',serif;font-weight:700;font-size:24px">ZENVERSE Z</div>
<script>
Promise.race([
  document.fonts.load('700 24px "Brick Sans"'),
  new Promise(function(res){setTimeout(res,5000);})
]).then(function(){return document.fonts.ready;}).then(function(){
  document.getElementById('r').textContent =
    'BrickSansLoaded=' + document.fonts.check('700 24px "Brick Sans"');
});
</script></body></html>
